# App data lives in InsForge (INSFORGE_URL / INSFORGE_API_KEY in .env). Host ports avoid the self-hosted Langfuse stack (3000, 6379).
x-api-env: &api-env
  REDIS_URL: redis://redis:6379
  LANGFUSE_HOST: http://host.docker.internal:3000   # send traces to host Langfuse; links use LANGFUSE_BASE_URL
  CORS_ORIGINS: http://localhost:3100
services:
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  api:
    build: ./api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment: *api-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on: {redis: {condition: service_started}}
  worker:
    build: ./api
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment: *api-env
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: {api: {condition: service_started}}
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
        NEXT_PUBLIC_INSFORGE_URL: ${NEXT_PUBLIC_INSFORGE_URL}
        NEXT_PUBLIC_INSFORGE_ANON_KEY: ${NEXT_PUBLIC_INSFORGE_ANON_KEY}
    ports: ["3100:3000"]
    depends_on: [api]
