# ponytail: hand-compiled snapshot of policybazaar.com (2026-09-29); re-scrape to refresh.
as_of: "2026-09-29"
source: "Compiled from public listings on policybazaar.com; figures are indicative starting prices, verify before buying."
glossary:
  IDV: "Insured Declared Value: the vehicle's current market value and the most paid on theft or total loss; about 5% below ex-showroom when new, falls with age."
  NCB: "No Claim Bonus: own-damage premium discount for each claim-free year, up to 50%; stays with the owner when switching insurer."
  zero_dep: "Zero depreciation: motor add-on that pays for replaced parts without deducting depreciation; plans often cap zero-dep claims per year."
  co_pay: "Co-payment: fixed share of each claim (e.g. 10-20%) paid by the policyholder; the insurer pays the rest."
  waiting_period: "Time before certain claims are paid: usually 30 days for illness (accidents from day 1), ~2 years for specific diseases, 3 years for pre-existing diseases."
  CSR: "Claim settlement ratio: percent of claims received in a year that the insurer settled; above 95% is considered good for term plans."
  third_party: "Mandatory motor cover for injury, death or property damage caused to others (property capped at ₹7.5L); does not cover your own vehicle."
  sum_insured: "Most the insurer pays in a policy year (health/travel), or the life cover paid to the nominee (term: sum assured)."
